<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model Preview</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #171310;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fed7aa;
        font: 600 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="fallback" id="fallback">Loading model...</div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.174.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/loaders/GLTFLoader.js";
      import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.174.0/examples/jsm/controls/OrbitControls.js";

      const src = new URLSearchParams(window.location.search).get("src") || "/legacy-race/assets/sloth.glb";
      const fallback = document.querySelector("#fallback");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x171310);

      const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.position.set(0, 1.1, 4.2);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enablePan = false;
      controls.enableDamping = true;
      controls.minDistance = 2.4;
      controls.maxDistance = 7;
      controls.target.set(0, 0.65, 0);

      scene.add(new THREE.HemisphereLight(0xfff1df, 0x27160e, 2.2));
      const keyLight = new THREE.DirectionalLight(0xffd5aa, 2.4);
      keyLight.position.set(3, 4, 3);
      scene.add(keyLight);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(1.75, 64),
        new THREE.MeshBasicMaterial({ color: 0x2b211a, transparent: true, opacity: 0.92 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      let modelRoot = null;
      new GLTFLoader().load(
        src,
        (gltf) => {
          fallback.remove();
          modelRoot = gltf.scene;
          normalizeModel(modelRoot);
          scene.add(modelRoot);
        },
        undefined,
        () => {
          fallback.textContent = "Model could not be loaded.";
        }
      );

      function normalizeModel(model) {
        let box = new THREE.Box3().setFromObject(model);
        let size = box.getSize(new THREE.Vector3());
        if (size.z > size.x) {
          model.rotation.y = Math.PI / 2;
          box = new THREE.Box3().setFromObject(model);
          size = box.getSize(new THREE.Vector3());
        }

        const scale = 2.15 / Math.max(size.x, size.y, size.z, 0.001);
        model.scale.setScalar(scale);
        box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.x -= center.x;
        model.position.z -= center.z;
        box = new THREE.Box3().setFromObject(model);
        model.position.y -= box.min.y;
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        if (modelRoot) modelRoot.rotation.y += 0.004;
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
